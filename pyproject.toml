[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multical"
version = "0.5.0.dev0"
description = "Flexible multi-camera multi-board camera calibration library and application."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  {name = "Oliver Batchelor", email = "saulzar@gmail.com"},
]
maintainers = [
  {name = "zhouhaozh", email = "zhouhaozh23868@gmail.com"},
]
keywords = ["camera", "calibration", "multical", "computer-vision"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.23.5,<2",
  "numba",
  "scipy",
  "matplotlib",
  "opencv-contrib-python==4.6.0.66",
  "simple-parsing",
  "natsort",
  "cached-property",
  "py-structs<1.0",
  "palettable",
  "numpy-quaternion",
  "omegaconf",
  "packaging",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/zhouhaozh/multical"
Source = "https://github.com/zhouhaozh/multical"
Upstream = "https://github.com/oliver-batchelor/multical"

[project.optional-dependencies]
test = [
  "pytest>=8",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
interactive = ["matplotlib", "qtpy", "pyvistaqt", "pyvista", "colour", "qtawesome"]

[project.scripts]
multical = "multical.app.multical:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["multical*"]

[tool.setuptools.package-data]
"multical.interface" = ["*.ui"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
